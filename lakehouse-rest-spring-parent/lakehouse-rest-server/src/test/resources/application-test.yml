# 测试专用数据源：内存 H2。
#
# 为什么需要这个文件：application.yml 的默认数据源已经是 MySQL，
# 若测试沿用默认值，跑单测就必须先有一个可用的 MySQL 实例。
# 这里把数据源换成内存 H2，测试因此不依赖任何外部服务。
#
# 值的选取与「切换 MySQL 之前」的默认配置完全一致（同一个内存库名、
# 同样是 ddl-auto: update），目的是让这次数据源切换不改变测试的行为，
# 从而能干净地判断回归是否由配置切换引入。
#
# 由服务端测试类上的 @ActiveProfiles("test") 激活。
spring:
  datasource:
    url: jdbc:h2:mem:paimon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  # Flyway 在测试里关闭，建表仍交给 ddl-auto（与 h2 profile 同一个决定）。
  #
  # 为什么测试不走迁移：迁移脚本是 MySQL / PostgreSQL 方言，而测试数据源是
  # 原生模式的 H2（它不认 ENGINE=InnoDB / auto_increment / 内联 comment）。
  # 让 42 个测试类各自去连 MySQL 才能跑，是把「跑一遍单测」的门槛抬到「先装一个数据库」，
  # 与这个测试套件「不依赖任何外部服务」的设计前提相反。
  #
  # 代价说清楚：**测试里建表用的是 Hibernate 的 ddl-auto，不是迁移脚本**，
  # 因此测试绿不证明迁移脚本能跑。这由 FlywayBaselineTests 单独兜——
  # 它在 H2 的 MODE=MySQL 下把 MySQL 迁移基线整份执行一遍并断言表数；
  # 另一个理由是「迁移脚本会不会与实体漂移」由 gen-flyway-baseline.py --check 守。
  flyway:
    enabled: false

# 测试仓库另放一处，不共用 application.yml 的 file:///tmp/paimon-warehouse。
#
# 为什么必须分开：服务端现在会真的往表目录里写 schema/schema-<n>（见
# TableMetadataService），而 /tmp/paimon-warehouse 正是文档里手工起实例、
# 跑 Spark 示例时用的那个仓库。共用会让「跑一遍测试」在别人的演示仓库里
# 留下一堆 it_*.db / tm_*.db 目录，还可能在同名表上撞出
# `Schema in filesystem exists` —— 那是测试污染的错，看起来却像功能坏了。
#
# ${java.io.tmpdir} 由 Spring 从系统属性解析：仓库路径要随机器变化，
# 而 application-test.yml 是静态文件，写死一个绝对路径在别的机器上会失败。
lakehouse:
  rest:
    default-warehouse: "file://${java.io.tmpdir}/lakehouse-rest-server-tests/warehouse"
    initial-catalog:
      warehouse: "file://${java.io.tmpdir}/lakehouse-rest-server-tests/warehouse"

    # 认证与授权在测试里显式关闭（默认已是 true，这里要把默认压回去）。
    #
    # 为什么压回去：服务端绝大多数测试类验证的是「功能行为」，它们用 MockMvc 直打
    # 端点且不带令牌；默认开着会把每一个这样的用例都变成 401/403，让授权语义之外
    # 的回归被鉴权噪音淹没。显式开授权的用例（AuthorizationTests、PermissionManagementTests
    # 等 4 个类）在各自的 @SpringBootTest properties 里置 true——那个优先级更高，
    # 不受这里影响，授权链路照样测得到。
    auth:
      enabled: false
      # OIDC 在测试里显式关闭（application.yml 里默认是开的，且填了本地 Keycloak 参数）。
      #
      # 为什么必须在这里压回去：application.yml 的 oidc 段是**本地调试用的默认值**
      # （enabled: true + localhost:8081 的 Keycloak）。测试环境没有那个 IdP，
      # 于是「OIDC 已启用」这个状态会从两个方向把用例带偏：
      #   1) GET /api/console/v1/auth 的 methods 多出 oidc，登录方式的三个断言全挂；
      #   2) IdP 探活连不上 localhost:8081，verdict 反而可能不是用例期望的 FAIL
      #      ——探活把「连不上」归到哪一档由代码决定，不该由某个开发机上有没有
      #      Keycloak 决定。
      #
      # 换句话说：不写这一行，`mvn test` 的结果就取决于「跑测试的机器上有没有
      # localhost:8081 那个 Keycloak」，这正是测试套件最该消除的那类不确定性。
      # 这与上面 auth.enabled 是同一个手法——默认值面向「本机起服务看效果」，
      # 测试则必须跑在一个形状明确的部署上。
      #
      # 四个地址类字段一并清空，而不是只关 enabled：IdentityProviderApiTests 钉住的
      # 是「没接入 IdP」这张脸的完整形状（enabled=false **且** issuer / clientId
      # 不出现在响应里）。只关开关会留下一半「看起来接好了、其实没接」的状态，
      # 而空串经 IdentityProviderService#text 归一成 null、再被 NON_NULL 省掉，
      # 正是「没配」应有的表现。dev 默认值留在 application.yml，不要在这里复刻。
      #
      # 不受影响的两类测试：
      #   - OidcServiceTests / ConsoleAuthOidcConfigTests：纯单测，不加载 Spring 上下文，
      #     配置由用例自己 new 出来；
      #   - 需要「OIDC 已启用」这一档的：在各自的 @SpringBootTest properties 里
      #     显式开启（优先级高于本文件）。
      console:
        oidc:
          enabled: false
          issuer-uri: ""
          client-id: ""
          redirect-uri: ""
          post-logout-redirect-uri: ""
    authorization:
      enabled: false

    # 把落库加密密钥置空，让测试跑在「本部署没有密钥」这个状态下。
    #
    # application.yml 里配着一份（本地调试用，已被 git 跟踪），而
    # StaticCredentialDisabledApiTests 的前提恰恰是**没有**密钥：它要验的是
    # 「宁可拒绝保存静态凭据，也不明文落库」这个 fail-closed 方向。
    # 不置空的话那个类在 HEAD 上就不可能通过——它拿到的
    # staticCredentialsEnabled 是 true、保存静态凭据返回 201，
    # 两条断言都与配置现状相反，看起来像功能坏了，其实是用例的前提没被满足。
    #
    # 只改 test profile，不动 application.yml：那份密钥是给人手工起实例用的，
    # 而测试必须能在一个「干净部署」的形状下跑。
    # StaticCredentialApiTests 不吃这个值——它自己在 @SpringBootTest 的
    # properties 里带一份密钥，因此仍然测得到「配了密钥」的那半边。
    #
    # 空串即「关闭」，不是「非法」：CredentialCipher 把留空视为未启用加密，
    # 因此这里不需要别的占位写法。
    storage:
      credential-secret-key: ""
