# 凭据。这里只放占位值，**不要**把真实密码提交进仓库。
#
# 为什么用 stringData 而不是 data：
# stringData 收明文、由 apiserver 在写入时转成 base64，人能直接读懂并替换。
# 用 data 就得自己算 base64，既繁琐又容易出错。
#
# 注意 base64 不是加密——任何能读这个 Secret 的人都能还原出明文。
# Secret 的价值在于「与 ConfigMap 分开授权」，而不是隐藏内容。
#
# ---------------------------------------------------------------------------
# 推荐做法：不提交这个文件，改用命令行创建
# ---------------------------------------------------------------------------
#   kubectl -n lakehouse-rest create secret generic lakehouse-rest-credentials \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=REST_TOKEN="$(openssl rand -hex 32)"
#
# 生产环境应指向外部密钥管理（External Secrets Operator / Vault / KMS），
# 让集群里不长期存在明文凭据。
#
# ---------------------------------------------------------------------------
# 占位值必须替换后再 apply
# ---------------------------------------------------------------------------
# DB_PASSWORD：与 MySQL StatefulSet 的 root 口令是同一个值。
# REST_TOKEN ：客户端调用时放在 `Authorization: Bearer <值>` 里。
#              本清单未配 token-principals 映射，因此主体名就是令牌本身
#              （见 configmap.yaml 的说明）。
apiVersion: v1
kind: Secret
metadata:
  name: lakehouse-rest-credentials
type: Opaque
stringData:
  DB_PASSWORD: CHANGE_ME_DB_PASSWORD
  REST_TOKEN: CHANGE_ME_REST_TOKEN
