# slf4j-simple 的配置（测试期）。
#
# 默认压到 warn：Spark 启动时会打大量 INFO，淹没有用信息。
# 但 ERROR 必须留下——Spark 里「driver 反序列化不到 executor 的失败原因」
# 这类关键线索只是一条 ERROR 日志，被丢掉之后现场就只剩一句
# `UnknownReason`，看不出任何东西。
#
# 排查写路径时可以临时改成 info 或 debug（例如看 S3 的
# `Adding config entry for ... as ... to Hadoop config`）。
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true
